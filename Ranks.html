<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rankings — Yeeps Tiers</title>

  <meta name="description" content="Yeeps PvP rankings by category and tier." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0b0d;
      --panel: #0f1720;
      --slate: #36394c;
      --muted: #94a3b8;
      --accent: #576077;
      --blood: #960330;
      --blood-bright: #c8083f;
      --maxw: 1180px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #e6eef6;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(150, 3, 48, 0.16), transparent 60%),
        linear-gradient(165deg, var(--bg) 0%, var(--slate) 100%);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: "Rajdhani", Inter, sans-serif;
    }

    .topbar {
      display: flex;
      max-width: var(--maxw);
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 auto;
      padding: 22px 24px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: inherit;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
    }

    .brand-name {
      font-family: "Rajdhani", sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-links a {
      padding: 8px 12px;
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .top-links a.current,
    .top-links a:hover {
      color: white;
      background: rgba(255, 255, 255, 0.07);
    }

    .discord-pill {
      padding: 9px 15px !important;
      color: white !important;
      background: linear-gradient(160deg, var(--blood-bright), var(--blood)) !important;
      border-radius: 999px !important;
    }

    .page-head {
      display: flex;
      max-width: var(--maxw);
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin: 0 auto;
      padding: 42px 24px 0;
    }

    .page-head h1 {
      font-size: 38px;
    }

    .page-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .search {
      min-width: 220px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(15, 23, 32, 0.85);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      color: white;
      background: transparent;
      font: inherit;
      font-size: 13px;
    }

    .tabs {
      display: flex;
      max-width: var(--maxw);
      gap: 8px;
      margin: 0 auto;
      padding: 24px 24px 0;
      overflow-x: auto;
    }

    .tab {
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      font: 700 13px Inter, sans-serif;
    }

    .tab.active {
      border-color: rgba(150, 3, 48, 0.65);
      color: white;
      background: linear-gradient(160deg, rgba(150, 3, 48, 0.45), rgba(150, 3, 48, 0.1));
    }

    .content {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .overall-row,
    .player-chip {
      cursor: pointer;
      background: linear-gradient(165deg, rgba(20, 20, 20, 0.7), rgba(0, 0, 0, 0.5));
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .overall-row:hover,
    .player-chip:hover {
      border-color: rgba(150, 3, 48, 0.55);
      transform: translateY(-2px);
    }

    .overall-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .overall-rank {
      min-width: 35px;
      color: var(--muted);
      font-size: 18px;
      font-weight: 800;
    }

    .overall-rank.gold { color: #ffd700; }
    .overall-rank.silver { color: #c0c0c0; }
    .overall-rank.bronze { color: #cd7f32; }

    .avatar {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #c8083f, #576077);
      font-size: 13px;
      font-weight: 800;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      overflow: hidden;
      font-size: 15px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-rank {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .score {
      color: white;
      font-size: 14px;
      font-weight: 800;
    }

    .tier-block {
      margin-bottom: 24px;
    }

    .tier-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tier-badge {
      padding: 4px 12px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(160deg, var(--blood-bright), var(--blood));
      font-family: "Rajdhani", sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    .tier-count {
      color: var(--muted);
      font-size: 12px;
    }

    .player-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .player-chip {
      display: flex;
      min-width: 175px;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border-radius: 12px;
    }

    .player-chip .avatar {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      font-size: 11px;
    }

    .empty-state {
      padding: 40px 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      z-index: 100;
      display: none;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      position: relative;
      width: min(410px, 90vw);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 15px;
      background: linear-gradient(145deg, var(--panel), var(--slate));
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      border: 0;
      color: white;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
    }

    .modal-title {
      margin-bottom: 4px;
      font-family: "Rajdhani", sans-serif;
      font-size: 25px;
      font-weight: 700;
    }

    .modal-text {
      color: var(--muted);
      font-size: 13px;
    }

    .modal-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .category-chip {
      padding: 7px 9px;
      border-radius: 8px;
      color: #dce4ef;
      background: rgba(255, 255, 255, 0.07);
      font-size: 12px;
    }

    footer {
      display: flex;
      max-width: var(--maxw);
      justify-content: space-between;
      gap: 8px;
      margin: 0 auto;
      padding: 10px 24px 32px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .page-head {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        min-width: 0;
      }

      .top-links a:not(.discord-pill) {
        display: none;
      }

      footer {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="https://yeeplist.page.gd/images/PvP_Rank.jpeg" alt="Yeeps Tiers" />
      <div>
        <div class="brand-name">Yeeps Tiers</div>
        <div class="brand-sub">The Yeeps List</div>
      </div>
    </a>

    <nav class="top-links">
      <a href="index.html">Home</a>
      <a class="current" href="Ranks.html">Rankings</a>
      <a class="discord-pill" href="https://discord.gg/7mry9QQCGH" target="_blank" rel="noopener">
        Join Discord
      </a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <div>
        <h1>PvP Rankings</h1>
        <p>Overall scores are calculated out of 1,000 points.</p>
      </div>

      <label class="search">
        <input id="search" type="search" placeholder="Search player..." />
      </label>
    </section>

    <nav id="tabs" class="tabs"></nav>

    <section id="content" class="content"></section>
  </main>

  <footer>
    <span>The Yeeps List — not affiliated with Trass Games</span>
    <span>V2.0 Pre-release 1</span>
  </footer>

  <div id="modal" class="modal">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Close player details">×</button>
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-text" class="modal-text"></div>
      <div id="modal-categories" class="modal-categories"></div>
    </div>
  </div>

  <script>
    /*
      EDIT PLAYERS HERE

      Each player can have a tier in any of these categories:
      Shield, Dagger, Mace, Double Bat, Freeze Glove, SMP, Scythe

      Allowed tiers:
      S+, S, A+, A, B+, B, C, D

      Example:
      {
        name: "PlayerName",
        ranks: {
          "Shield": "S+",
          "Dagger": "A",
          "Mace": "B"
        }
      }
    */

    const categories = [
      "Overall",
      "Shield",
      "Dagger",
      "Mace",
      "Double Bat",
      "Freeze Glove",
      "SMP",
      "Scythe"
    ];

    const players = [
      {
        name: "ExamplePlayer",
        ranks: {
          "Shield": "S+",
          "Dagger": "S",
          "Mace": "A+",
          "Double Bat": "A",
          "Freeze Glove": "S",
          "SMP": "B+",
          "Scythe": "A"
        }
      },
      {
        name: "AnotherPlayer",
        ranks: {
          "Shield": "A",
          "Dagger": "S+",
          "Mace": "S",
          "Double Bat": "B+",
          "Freeze Glove": "A+",
          "SMP": "S",
          "Scythe": "B"
        }
      },
      {
        name: "NewPlayer",
        ranks: {
          "Shield": "B",
          "Dagger": "A",
          "Mace": "B+",
          "Double Bat": "S",
          "Freeze Glove": "A",
          "SMP": "A+",
          "Scythe": "S+"
        }
      }
    ];

    /*
      POINT VALUES

      The player score is normalized to a maximum of 1,000.
      A player with S+ in all seven categories has 1,000 points.
    */
    const tierPoints = {
      "S+": 100,
      "S": 92,
      "A+": 84,
      "A": 76,
      "B+": 68,
      "B": 58,
      "C": 45,
      "D": 30
    };

    const tierOrder = {
      "S+": 8,
      "S": 7,
      "A+": 6,
      "A": 5,
      "B+": 4,
      "B": 3,
      "C": 2,
      "D": 1
    };

    let activeCategory = "Overall";
    let searchQuery = "";

    const tabs = document.getElementById("tabs");
    const content = document.getElementById("content");
    const search = document.getElementById("search");

    function initials(name) {
      return name
        .split(" ")
        .map((word) => word[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }

    function calculateScore(player) {
      const rankedCategories = categories.filter(
        (category) => category !== "Overall" && player.ranks[category]
      );

      if (!rankedCategories.length) return 0;

      const earned = rankedCategories.reduce(
        (total, category) => total + (tierPoints[player.ranks[category]] || 0),
        0
      );

      const maximum = rankedCategories.length * tierPoints["S+"];

      return Math.round((earned / maximum) * 1000);
    }

    function overallRankName(score) {
      if (score >= 950) return "Grandmaster";
      if (score >= 850) return "Master";
      if (score >= 750) return "Elite";
      if (score >= 650) return "Diamond";
      if (score >= 550) return "Platinum";
      if (score >= 450) return "Gold";
      if (score >= 300) return "Silver";
      return "Bronze";
    }

    function renderTabs() {
      tabs.innerHTML = "";

      categories.forEach((category) => {
        const button = document.createElement("button");
        button.className = `tab ${category === activeCategory ? "active" : ""}`;
        button.textContent = category;

        button.addEventListener("click", () => {
          activeCategory = category;
          renderTabs();
          renderContent();
        });

        tabs.appendChild(button);
      });
    }

    function filteredPlayers() {
      return players.filter((player) =>
        player.name.toLowerCase().includes(searchQuery.toLowerCase())
      );
    }

    function renderOverall() {
      const ranked = filteredPlayers()
        .map((player) => ({
          ...player,
          score: calculateScore(player)
        }))
        .sort((a, b) => b.score - a.score);

      if (!ranked.length) {
        content.innerHTML = `<div class="empty-state">No players found.</div>`;
        return;
      }

      content.innerHTML = ranked
        .map((player, index) => {
          const placementClass =
            index === 0 ? "gold" :
            index === 1 ? "silver" :
            index === 2 ? "bronze" : "";

          return `
            <article class="overall-row" data-player="${player.name}">
              <div class="overall-rank ${placementClass}">#${index + 1}</div>
              <div class="avatar">${initials(player.name)}</div>
              <div class="player-info">
                <div class="player-name">${player.name}</div>
                <div class="player-rank">${overallRankName(player.score)}</div>
              </div>
              <div class="score">${player.score}/1000</div>
            </article>
          `;
        })
        .join("");

      document.querySelectorAll("[data-player]").forEach((row) => {
        row.addEventListener("click", () => {
          const player = players.find(
            (entry) => entry.name === row.dataset.player
          );
          openModal(player);
        });
      });
    }

    function renderCategory(category) {
      const categoryPlayers = filteredPlayers()
        .filter((player) => player.ranks[category])
        .sort(
          (a, b) =>
            tierOrder[b.ranks[category]] - tierOrder[a.ranks[category]]
        );

      if (!categoryPlayers.length) {
        content.innerHTML = `<div class="empty-state">No players ranked in ${category}.</div>`;
        return;
      }

      const tiers = ["S+", "S", "A+", "A", "B+", "B", "C", "D"];

      content.innerHTML = tiers
        .map((tier) => {
          const tierPlayers = categoryPlayers.filter(
            (player) => player.ranks[category] === tier
          );

          if (!tierPlayers.length) return "";

          return `
            <section class="tier-block">
              <div class="tier-head">
                <span class="tier-badge">${tier} Tier</span>
                <span class="tier-count">${tierPlayers.length} player${tierPlayers.length === 1 ? "" : "s"}</span>
              </div>

              <div class="player-grid">
                ${tierPlayers
                  .map(
                    (player) => `
                      <article class="player-chip" data-player="${player.name}">
                        <div class="avatar">${initials(player.name)}</div>
                        <div>
                          <div class="player-name">${player.name}</div>
                          <div class="player-rank">${calculateScore(player)}/1000 overall</div>
                        </div>
                      </article>
                    `
                  )
                  .join("")}
              </div>
            </section>
          `;
        })
        .join("");

      document.querySelectorAll("[data-player]").forEach((chip) => {
        chip.addEventListener("click", () => {
          const player = players.find(
            (entry) => entry.name === chip.dataset.player
          );
          openModal(player);
        });
      });
    }

    function renderContent() {
      if (activeCategory === "Overall") {
        renderOverall();
      } else {
        renderCategory(activeCategory);
      }
    }

    function openModal(player) {
      const score = calculateScore(player);

      document.getElementById("modal-title").textContent = player.name;

      document.getElementById("modal-text").textContent =
        `${overallRankName(score)} • ${score}/1000 Overall Points`;

      document.getElementById("modal-categories").innerHTML = Object.entries(player.ranks)
        .map(
          ([category, tier]) =>
            `<span class="category-chip">${category}: ${tier}</span>`
        )
        .join("");

      document.getElementById("modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    search.addEventListener("input", (event) => {
      searchQuery = event.target.value;
      renderContent();
    });

    document.getElementById("modal-close").addEventListener("click", closeModal);

    document.getElementById("modal").addEventListener("click", (event) => {
      if (event.target.id === "modal") closeModal();
    });

    renderTabs();
    renderContent();
  </script>
</body>
</html>
