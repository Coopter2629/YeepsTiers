<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rankings — Yeeps Tiers</title>
<meta name="description" content="Yeeps PvP rankings by category and tier." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#0f1720;--slate:#36394c;--muted:#94a3b8;--accent:#576077;--blood:#960330;--blood-bright:#c8083f;--maxw:1180px;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;color:#e6eef6;background:radial-gradient(1200px 600px at 15% -10%,rgba(150,3,48,.16),transparent 60%),linear-gradient(165deg,var(--bg),var(--slate))}h1,h2,h3{margin:0;font-family:Rajdhani,Inter,sans-serif}.topbar{display:flex;max-width:var(--maxw);align-items:center;justify-content:space-between;gap:16px;margin:0 auto;padding:22px 24px 0}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}.brand-name{font:700 20px Rajdhani,sans-serif}.brand-sub{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.top-links{display:flex;align-items:center;gap:8px}.top-links a{padding:8px 12px;border-radius:8px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.top-links a.current,.top-links a:hover{color:#fff;background:#ffffff12}.discord-pill{padding:9px 15px!important;color:#fff!important;background:linear-gradient(160deg,var(--blood-bright),var(--blood))!important;border-radius:999px!important}.page-head{display:flex;max-width:var(--maxw);align-items:end;justify-content:space-between;gap:18px;margin:0 auto;padding:42px 24px 0}.page-head h1{font-size:38px}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.search{min-width:220px;padding:10px 14px;border:1px solid #ffffff14;border-radius:10px;background:#0f1720dd}.search input{width:100%;border:0;outline:0;color:#fff;background:transparent;font:inherit;font-size:13px}.tabs{display:flex;max-width:var(--maxw);gap:8px;margin:0 auto;padding:24px 24px 0;overflow-x:auto}.tab{flex:0 0 auto;padding:10px 14px;border:1px solid #ffffff14;border-radius:999px;color:var(--muted);background:#00000059;cursor:pointer;font:700 13px Inter,sans-serif}.tab.active{border-color:#960330a6;color:#fff;background:linear-gradient(160deg,#96033073,#9603301a)}.content{max-width:var(--maxw);margin:0 auto;padding:28px 24px 64px}.overall-row,.player-chip{cursor:pointer;background:linear-gradient(165deg,#141414b3,#00000080);border:1px solid #ffffff12;transition:transform .15s,border-color .15s}.overall-row:hover,.player-chip:hover{border-color:#9603308c;transform:translateY(-2px)}.overall-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;padding:12px 16px;border-radius:12px}.overall-rank{min-width:35px;color:var(--muted);font-size:18px;font-weight:800}.gold{color:#ffd700}.silver{color:#c0c0c0}.bronze{color:#cd7f32}.avatar{display:grid;width:44px;height:44px;place-items:center;overflow:hidden;border-radius:10px;color:#fff;background:linear-gradient(135deg,#c8083f,#576077);font-size:13px;font-weight:800}.avatar img{width:100%;height:100%;object-fit:cover}.player-info{flex:1;min-width:0}.player-name{overflow:hidden;font-size:15px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.player-rank{margin-top:3px;color:var(--muted);font-size:12px}.score{color:#fff;font-size:14px;font-weight:800}.tier-block{margin-bottom:24px}.tier-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 4px;border-bottom:1px solid #ffffff14}.tier-badge{padding:4px 12px;border-radius:999px;color:#fff;background:linear-gradient(160deg,var(--blood-bright),var(--blood));font:700 16px Rajdhani,sans-serif}.tier-count{color:var(--muted);font-size:12px}.player-grid{display:flex;flex-wrap:wrap;gap:10px}.player-chip{display:flex;min-width:175px;align-items:center;gap:10px;padding:9px 14px 9px 9px;border-radius:12px}.player-chip .avatar{width:36px;height:36px;border-radius:9px;font-size:11px}.empty-state{padding:40px 0;color:var(--muted);text-align:center;font-size:13px}.modal{position:fixed;z-index:100;display:none;inset:0;align-items:center;justify-content:center;background:#000000b3}.modal.active{display:flex}.modal-card{position:relative;width:min(410px,90vw);padding:24px;border:1px solid #ffffff17;border-radius:15px;background:linear-gradient(145deg,var(--panel),var(--slate))}.modal-close{position:absolute;top:12px;right:14px;border:0;color:#fff;background:transparent;cursor:pointer;font-size:20px}.modal-title{margin-bottom:4px;font:700 25px Rajdhani,sans-serif}.modal-text{color:var(--muted);font-size:13px}.modal-categories{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.category-chip{padding:7px 9px;border-radius:8px;color:#dce4ef;background:#ffffff12;font-size:12px}footer{display:flex;max-width:var(--maxw);justify-content:space-between;gap:8px;margin:0 auto;padding:10px 24px 32px;color:var(--muted);font-size:12px}@media(max-width:700px){.page-head{align-items:stretch;flex-direction:column}.search{min-width:0}.top-links a:not(.discord-pill){display:none}footer{flex-direction:column}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><img src="Image/pfp.png" alt="Yeeps Tiers"><div><div class="brand-name">Yeeps Tiers</div><div class="brand-sub">The Yeeps List</div></div></a><nav class="top-links"><a href="index.html">Home</a><a class="current" href="Ranks.html">Rankings</a><a class="discord-pill" href="https://discord.gg/dtVaUvekyc" target="_blank" rel="noopener">Join Discord</a></nav></header>
<main><section class="page-head"><div><h1>PvP Rankings</h1><p>Overall scores are calculated out of 1,000 points.</p></div><label class="search"><input id="search" type="search" placeholder="Search player..."></label></section><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section></main>
<footer><span>The Yeeps List — not affiliated with Trass Games</span><span>V2.0 Pre-release 1</span></footer>
<div id="modal" class="modal"><div class="modal-card"><button id="modal-close" class="modal-close" aria-label="Close player details">×</button><div id="modal-title" class="modal-title"></div><div id="modal-text" class="modal-text"></div><div id="modal-categories" class="modal-categories"></div></div></div>
<script type="module">
import { players } from "./Players.js";

const categories=["Overall","Shield","Dagger","Mace","Double Bat","Freeze Glove","SMP","Scythe"];
const tierPoints={"S+":100,S:92,"A+":84,A:76,"B+":68,B:58,C:45,D:30};
const tierOrder={"S+":8,S:7,"A+":6,A:5,"B+":4,B:3,C:2,D:1};
let activeCategory="Overall",searchQuery="";
const tabs=document.getElementById("tabs"),content=document.getElementById("content"),search=document.getElementById("search");
const initials=name=>name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avatar=player=>`<div class="avatar">${player.image?`<img src="${player.image}" alt="${player.name}">`:initials(player.name)}</div>`;
function calculateScore(player){
  const ranked = categories.filter(c => c !== "Overall" && player.ranks[c]);
  return ranked.reduce((sum, c) => sum + (tierPoints[player.ranks[c]] || 0), 0);
}
function rankName(score){if(score>=950)return"Grandmaster";if(score>=850)return"Master";if(score>=750)return"Elite";if(score>=650)return"Diamond";if(score>=550)return"Platinum";if(score>=450)return"Gold";if(score>=300)return"Silver";return"Bronze"}
function visiblePlayers(){return players.filter(p=>p.name.toLowerCase().includes(searchQuery.toLowerCase()))}
function playerByName(name){return players.find(p=>p.name===name)}
function bindOpen(){document.querySelectorAll("[data-player]").forEach(node=>node.onclick=()=>openModal(playerByName(node.dataset.player)))}
function renderTabs(){tabs.innerHTML=categories.map(c=>`<button class="tab ${c===activeCategory?"active":""}" data-cat="${c}">${c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderTabs();renderContent()})}
function renderOverall(){const ranked=visiblePlayers().map(p=>({...p,score:calculateScore(p)})).sort((a,b)=>b.score-a.score);if(!ranked.length){content.innerHTML='<div class="empty-state">No players found.</div>';return}content.innerHTML=ranked.map((p,i)=>`<article class="overall-row" data-player="${p.name}"><div class="overall-rank ${i===0?"gold":i===1?"silver":i===2?"bronze":""}">#${i+1}</div>${avatar(p)}<div class="player-info"><div class="player-name">${p.name}</div><div class="player-rank">${rankName(p.score)}</div></div><div class="score">${p.score}/1000</div></article>`).join("");bindOpen()}
function renderCategory(category){const list=visiblePlayers().filter(p=>p.ranks[category]).sort((a,b)=>tierOrder[b.ranks[category]]-tierOrder[a.ranks[category]]);if(!list.length){content.innerHTML=`<div class="empty-state">No players ranked in ${category}.</div>`;return}const tierList=["S+","S","A+","A","B+","B","C","D"];content.innerHTML=tierList.map(t=>{const group=list.filter(p=>p.ranks[category]===t);if(!group.length)return"";return `<section class="tier-block"><div class="tier-head"><span class="tier-badge">${t} Tier</span><span class="tier-count">${group.length} player${group.length===1?"":"s"}</span></div><div class="player-grid">${group.map(p=>`<article class="player-chip" data-player="${p.name}">${avatar(p)}<div><div class="player-name">${p.name}</div><div class="player-rank">${calculateScore(p)}/1000 overall</div></div></article>`).join("")}</div></section>`}).join("");bindOpen()}
function renderContent(){activeCategory==="Overall"?renderOverall():renderCategory(activeCategory)}
function openModal(player){const score=calculateScore(player);document.getElementById("modal-title").textContent=player.name;document.getElementById("modal-text").textContent=`${rankName(score)} • ${score}/1000 Overall Points`;document.getElementById("modal-categories").innerHTML=Object.entries(player.ranks).map(([c,t])=>`<span class="category-chip">${c}: ${t}</span>`).join("");document.getElementById("modal").classList.add("active")}
search.oninput=e=>{searchQuery=e.target.value;renderContent()};document.getElementById("modal-close").onclick=()=>document.getElementById("modal").classList.remove("active");document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("active")};renderTabs();renderContent();
</script>
</body>
</html>
