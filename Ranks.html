<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rankings — Yeeps Tiers</title>
  <link rel="icon" type="image/png" href="./Image/pfp.png" />
  <meta name="description" content="Yeeps PvP rankings by category and tier." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style2.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img src="Image/pfp.png" alt="Yeeps Tiers">
      <div>
        <div class="brand-name">Yeeps Tiers</div>
        <div class="brand-sub">The Yeeps List</div>
      </div>
    </a>
    <nav class="top-links">
      <a href="index.html">Home</a>
      <a class="current" href="Ranks.html">Rankings</a>
      <a class="discord-pill" href="https://discord.gg/dtVaUvekyc" target="_blank" rel="noopener">Join Discord</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <div>
        <h1>PvP Rankings</h1>
        <p>Overall scores are calculated out of 700 points.(any new tiers will add an extra 100 points)</p>
      </div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <label class="search"><input id="search" type="search" placeholder="Search player..."></label>
        <button id="admin-add-btn" class="tab">+ Add Player</button>
      </div>
    </section>

    <nav id="tabs" class="tabs"></nav>
    <section id="content" class="content"></section>
  </main>

  <footer>
    <span>The Yeeps List — not affiliated with Trass Games</span>
    <span>V6.8 Pre-release 1</span>
  </footer>

  <!-- View Details Modal -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <button id="modal-close" class="modal-close" aria-label="Close player details">×</button>
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-text" class="modal-text"></div>
      <div id="modal-categories" class="modal-categories"></div>
    </div>
  </div>

  <!-- Admin Edit/Delete Modal -->
  <div id="edit-modal" class="modal">
    <div class="modal-card">
      <button id="edit-modal-close" class="modal-close">×</button>
      <h2 id="edit-modal-title">Edit / Add Player</h2>
      
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px;">
        <label>Name: <input id="edit-name" type="text" placeholder="Player Name"></label>
        <label>Shield: <input id="edit-shield" type="text" placeholder="e.g. HT1"></label>
        <label>Dagger: <input id="edit-dagger" type="text" placeholder="e.g. LT2"></label>
        <label>Mace: <input id="edit-mace" type="text" placeholder="e.g. HT3"></label>
        <label>Double Bat: <input id="edit-bat" type="text" placeholder="e.g. LT1"></label>
        <label>Freeze Glove: <input id="edit-glove" type="text" placeholder="e.g. HT2"></label>
        <label>SMP: <input id="edit-smp" type="text" placeholder="e.g. LT3"></label>
        <label>Scythe: <input id="edit-scythe" type="text" placeholder="e.g. HT1"></label>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button id="save-player-btn" class="btn-primary" style="flex: 1;">Save Changes</button>
        <button id="delete-player-btn" class="btn-primary" style="background: var(--blood); flex: 1;">Delete Player</button>
      </div>
    </div>
  </div>

  <script type="module" src="./rankings.js"></script>
</body>
</html>
