<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rankings — Yeeps Tiers</title>
<link rel="icon" type="image/png" href="./Image/pfp.png" />
<meta name="description" content="Yeeps PvP rankings by category and tier." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style2.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><img src="Image/pfp.png" alt="Yeeps Tiers"><div><div class="brand-name">Yeeps Tiers</div><div class="brand-sub">The Yeeps List</div></div></a><nav class="top-links"><a href="index.html">Home</a><a class="current" href="Ranks.html">Rankings</a><a class="discord-pill" href="https://discord.gg/dtVaUvekyc" target="_blank" rel="noopener">Join Discord</a></nav></header>
<main><section class="page-head"><div><h1>PvP Rankings</h1><p>Overall scores are calculated out of 700 points.(any new tiers will add an extra 100 points)</p></div><label class="search"><input id="search" type="search" placeholder="Search player..."></label></section><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section></main>
<footer><span>The Yeeps List — not affiliated with Trass Games</span><span>V6.8 Pre-release 1</span></footer>
<div id="modal" class="modal"><div class="modal-card"><button id="modal-close" class="modal-close" aria-label="Close player details">×</button><div id="modal-title" class="modal-title"></div><div id="modal-text" class="modal-text"></div><div id="modal-categories" class="modal-categories"></div></div></div>
<script type="module">
import { players } from "./Players.js";

const categories=["Overall","Shield","Dagger","Mace","Double Bat","Freeze Glove","SMP","Scythe"];
const tierPoints={"S+":100,S:92,"A+":84,A:76,"B+":68,B:58,C:45,D:30,L:-100,"Kai Yeeps":-9999999999999999,"HT1":100,"LT1":92,"HT2":84,"LT2":76,"HT3":68,"LT3":58,"HT4":45,"LT4":30,"HT5":25,"Lt5":20};
const tierOrder={"S+":8,S:7,"A+":6,A:5,"B+":4,B:3,C:2,D:1,"Ht1":10,"Lt1":9,"HT2":8,"LT2":7,"HT3":6,"LT3":5,"HT4":4,"LT4":3,"HT5":2,"LT5":1};
let activeCategory="Overall",searchQuery="";
const tabs=document.getElementById("tabs"),content=document.getElementById("content"),search=document.getElementById("search");
const initials=name=>name.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const avatar=player=>`<div class="avatar">${player.image?`<img src="${player.image}" alt="${player.name}">`:initials(player.name)}</div>`;
function calculateScore(player){
  const ranked = categories.filter(c => c !== "Overall" && player.ranks[c]);
  return ranked.reduce((sum, c) => sum + (tierPoints[player.ranks[c]] || 0), 0);
}
function rankName(score){if(score>=650)return"Grandmaster";if(score>=600)return"Master";if(score>=550)return"Elite";if(score>=500)return"Diamond";if(score>=450)return"Platinum";if(score>=400)return"Gold";if(score>=350)return"Silver";return"Bronze"}
function visiblePlayers(){return players.filter(p=>p.name.toLowerCase().includes(searchQuery.toLowerCase()))}
function playerByName(name){return players.find(p=>p.name===name)}
function bindOpen(){document.querySelectorAll("[data-player]").forEach(node=>node.onclick=()=>openModal(playerByName(node.dataset.player)))}
function renderTabs(){tabs.innerHTML=categories.map(c=>`<button class="tab ${c===activeCategory?"active":""}" data-cat="${c}">${c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderTabs();renderContent()})}
function renderOverall(){const ranked=visiblePlayers().map(p=>({...p,score:calculateScore(p)})).sort((a,b)=>b.score-a.score);if(!ranked.length){content.innerHTML='<div class="empty-state">No players found.</div>';return}content.innerHTML=ranked.map((p,i)=>`<article class="overall-row" data-player="${p.name}"><div class="overall-rank ${i===0?"gold":i===1?"silver":i===2?"bronze":""}">#${i+1}</div>${avatar(p)}<div class="player-info"><div class="player-name">${p.name}</div><div class="player-rank">${rankName(p.score)}</div></div><div class="score">${p.score}/700</div></article>`).join("");bindOpen()}
function renderCategory(category){const list=visiblePlayers().filter(p=>p.ranks[category]).sort((a,b)=>tierOrder[b.ranks[category]]-tierOrder[a.ranks[category]]);if(!list.length){content.innerHTML=`<div class="empty-state">No players ranked in ${category}.</div>`;return}const tierList = ["S+", "S", "A+", "A", "B+", "B", "C", "D", "L","HT1", "LT1", "HT2", "LT2", "HT3", "LT3", "HT4", "LT4", "HT5", "LT5"];content.innerHTML=tierList.map(t=>{const group=list.filter(p=>p.ranks[category]===t);if(!group.length)return"";return `<section class="tier-block"><div class="tier-head"><span class="tier-badge">${t} Tier</span><span class="tier-count">${group.length} player${group.length===1?"":"s"}</span></div><div class="player-grid">${group.map(p=>`<article class="player-chip" data-player="${p.name}">${avatar(p)}<div><div class="player-name">${p.name}</div><div class="player-rank">${calculateScore(p)}/1000 overall</div></div></article>`).join("")}</div></section>`}).join("");bindOpen()}
function renderContent(){activeCategory==="Overall"?renderOverall():renderCategory(activeCategory)}
function openModal(player){const score=calculateScore(player);document.getElementById("modal-title").textContent=player.name;document.getElementById("modal-text").textContent=`${rankName(score)} • ${score}/700 Overall Points`;document.getElementById("modal-categories").innerHTML=Object.entries(player.ranks).map(([c,t])=>`<span class="category-chip">${c}: ${t}</span>`).join("");document.getElementById("modal").classList.add("active")}
search.oninput=e=>{searchQuery=e.target.value;renderContent()};document.getElementById("modal-close").onclick=()=>document.getElementById("modal").classList.remove("active");document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("active")};renderTabs();renderContent();
</script>
</body>
</html>
