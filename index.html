<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yeeps Tiers</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico" />
<meta name="description" content="The Yeeps PvP lists — rankings, teams, and player cards." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- hero ---------- */
.hero{
  max-width:var(--maxw);margin:0 auto;padding:64px 24px 20px;
  display:grid;grid-template-columns:1.1fr 0.9fr;gap:32px;align-items:center;
}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:40px;text-align:center;}
  .ring-wrap{margin:0 auto;}
}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--blood-bright);margin-bottom:14px;
}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--blood-bright);display:inline-block;}
@media(max-width:900px){.eyebrow{justify-content:center;}}

.hero h1{font-size:clamp(40px, 6vw, 68px);font-weight:700;line-height:1.02;}
.hero h1 .accent-word{color:var(--blood-bright);}
.hero p.lede{color:var(--muted);font-size:16px;line-height:1.6;max-width:46ch;margin:18px 0 28px;}
@media(max-width:900px){.hero p.lede{margin-left:auto;margin-right:auto;}}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;}
@media(max-width:900px){.hero-ctas{justify-content:center;}}

/* ---------- loadout ring (signature element) ---------- */
.ring-wrap{position:relative;width:340px;height:340px;display:flex;align-items:center;justify-content:center;}
.ring-glow{
  position:absolute;inset:18%;border-radius:50%;
  background:radial-gradient(circle, rgba(150,3,48,0.35), transparent 70%);filter:blur(6px);
}
.ring-core{
  position:relative;width:118px;height:118px;border-radius:50%;
  background:linear-gradient(160deg,var(--panel), var(--slate));
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(150,3,48,0.25), inset 0 0 20px rgba(0,0,0,0.4);
  z-index:2;
}
.ring-core img{width:56px;height:56px;border-radius:50%;object-fit:cover;}
.ring{position:absolute;inset:0;animation:spin 70s linear infinite;}
.ring-wrap:hover .ring{animation-play-state:paused;}
@media (prefers-reduced-motion: reduce){.ring{animation:none;}}
@keyframes spin{ to{ transform:rotate(360deg); } }

.ring-item{
  position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
  border-radius:12px;background:linear-gradient(160deg, rgba(20,20,20,0.85), rgba(0,0,0,0.7));
  border:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,0.5);
}
.ring-item img{width:30px;height:30px;border-radius:6px;object-fit:cover;}
.ring-item span{position:absolute;animation:counter-spin 70s linear infinite;}
.ring-wrap:hover .ring-item span{animation-play-state:paused;}
@media (prefers-reduced-motion: reduce){.ring-item span{animation:none;}}
@keyframes counter-spin{ to{ transform:rotate(-360deg); } }

.ri-1{transform:rotate(0deg) translate(150px) rotate(0deg);}
.ri-2{transform:rotate(60deg) translate(150px) rotate(-60deg);}
.ri-3{transform:rotate(120deg) translate(150px) rotate(-120deg);}
.ri-4{transform:rotate(180deg) translate(150px) rotate(-180deg);}
.ri-5{transform:rotate(240deg) translate(150px) rotate(-240deg);}
.ri-6{transform:rotate(300deg) translate(150px) rotate(-300deg);}
@media(max-width:900px){.ring-wrap{width:280px;height:280px;transform:scale(0.86);}}

/* ---------- nav cards ---------- */
.section{max-width:var(--maxw);margin:0 auto;padding:56px 24px 0;}
.nav-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:14px;}
@media(max-width:900px){.nav-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.nav-grid{grid-template-columns:1fr;}}

.nav-card{
  display:flex;flex-direction:column;gap:10px;
  background: linear-gradient(165deg, rgba(20,20,20,0.70), rgba(0,0,0,0.55));
  border:1px solid rgba(255,255,255,0.05);border-radius:var(--radius);padding:20px;
  text-decoration:none;color:inherit;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.nav-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,0.55);border-color:rgba(150,3,48,0.4);}
.nav-card .icon-badge{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(160deg,var(--accent),var(--bg));
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.nav-card h3{font-size:16px;font-weight:700;}
.nav-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0;}
.nav-card .go{margin-top:auto;font-size:12px;font-weight:700;color:var(--blood-bright);display:flex;align-items:center;gap:4px;}

/* ---------- weapon strip ---------- */
.weapon-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
.weapon-chip{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);
  padding:7px 12px 7px 7px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);
}
.weapon-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;}

/* ---------- community cta ---------- */
.cta-band{
  max-width:var(--maxw);margin:64px auto 0;padding:36px 28px;border-radius:18px;
  background:linear-gradient(150deg, rgba(150,3,48,0.18), rgba(15,23,32,0.6));
  border:1px solid rgba(150,3,48,0.25);
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.cta-band h2{font-size:24px;font-weight:700;margin-bottom:6px;}
.cta-band p{color:var(--muted);font-size:14px;margin:0;max-width:44ch;}

/* ---------- page-specific mobile ---------- */
@media(max-width:640px){
  .hero{padding:32px 16px 16px;}
  .hero-ctas{width:100%;}
  .hero-ctas a{flex:1;text-align:center;}
  .section{padding:40px 16px 0;}
  .cta-band{margin:44px 16px 0;padding:26px 20px;justify-content:center;text-align:center;}
  .cta-band > div{width:100%;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img id="brandLogo" src="" alt="" />
    <div>
      <div class="brand-name" id="brandName"></div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
  </div>
  <div class="top-links" id="topLinks"></div>
</div>

<section class="hero">
  <div>
    <div class="eyebrow" id="heroEyebrow"></div>
    <h1 id="heroHeadline"></h1>
    <p class="lede" id="heroLede"></p>
    <div class="hero-ctas" id="heroCtas"></div>
  </div>

  <div class="ring-wrap">
    <div class="ring-glow"></div>
    <div class="ring" id="ring"></div>
    <div class="ring-core">
      <img id="ringCoreImg" src="" alt="" />
    </div>
  </div>
</section>

<section class="section">
  <div class="nav-grid" id="navGrid"></div>
  <div class="weapon-strip" id="weaponStrip"></div>
</section>

<div class="cta-band">
  <div>
    <h2 id="ctaHeadline"></h2>
    <p id="ctaBody"></p>
  </div>
  <a class="discord-pill" id="ctaDiscordBtn" href="" target="_blank" rel="noopener"></a>
</div>

<footer>
  <span id="footerLeft"></span>
  <span id="footerRight"></span>
</footer>

<script>
/* =====================================================================
   EDIT EVERYTHING HERE. This is the only section you should need to
   touch to change text, links, images, nav cards, or weapons.
   Colors/fonts/topbar/footer styling live in styles.css instead.
   ===================================================================== */
const siteConfig = {

  brand: {
    logo: "https://yeeplist.page.gd/images/PvP_Rank.jpeg",
    name: "Yeeps Tiers",
    sub: "The Yeeps List"
  },

  topLinks: [
    { label: "Rankings",    href: "Ranks.html" },
    { label: "Teams",       href: "Teams.html" },
    { label: "Player Cards", href: "Card.html" },
    { label: "LTMs",        href: "ltm.html" }
  ],

  discord: {
    label: "Join Discord",
    url: "https://discord.gg/dtVaUvekyc",
    icon: "https://yeeplist.page.gd/images/Discord.jpeg"
  },

  hero: {
    eyebrow: "Yeeps PvP · Community Rankings",
    headlineHtml: 'Every blade earns<br />its <span class="accent-word">tier</span>.',
    lede: "Track the best Yeeps PvP players across bats, daggers, shields, fire axes and more — ranked, tiered, and updated by the community.",
    primaryCta: { label: "View Rankings", href: "Ranks.html" },
    secondaryCta: { label: "Team Rankings", href: "Teams.html" },
    ringCenterImage: "https://yeeplist.page.gd/images/PvP_Rank.jpeg"
  },

  ringWeapons: [
    { name: "Bat",          img: "https://yeeplist.page.gd/images/Bat_Tier4.png" },
    { name: "Freeze Glove", img: "https://yeeplist.page.gd/images/Freeze_Glove.png" },
    { name: "Mace",         img: "https://yeeplist.page.gd/images/SwarmSlayer.jpg" },
    { name: "Shield",       img: "https://yeeplist.page.gd/images/Tier3.png" },
    { name: "Fire Axe",     img: "https://yeeplist.page.gd/images/Desert.png" },
    { name: "Scythe",       img: "https://yeeplist.page.gd/images/Horror.jpg" }
  ],

  navCards: [
    { icon: "🏆", title: "PvP Rankings",  desc: "See individual players ranked across every PvP category, from Bat to Scythe.", cta: "Browse rankings →", href: "Ranks.html" },
    { icon: "🛡️", title: "Team Rankings", desc: "Check out the best teams competing in Yeeps PvP right now.", cta: "See teams →", href: "Teams.html" },
    { icon: "🪪", title: "Player Cards",  desc: "View detailed player cards, tier history, and per-category standing.", cta: "Look up a player →", href: "Card.html" },
    { icon: "⏱️", title: "LTMs",          desc: "Explore current and previous limited time modes and their leaderboards.", cta: "See LTMs →", href: "ltm.html" }
  ],

  weaponStrip: [
    { name: "Bat",          img: "https://yeeplist.page.gd/images/Bat_Tier4.png" },
    { name: "Dagger",       img: "https://yeeplist.page.gd/images/PvP_Rank.jpeg" },
    { name: "Freeze Glove", img: "https://yeeplist.page.gd/images/Freeze_Glove.png" },
    { name: "Mace",         img: "https://yeeplist.page.gd/images/SwarmSlayer.jpg" },
    { name: "Shield",       img: "https://yeeplist.page.gd/images/Tier3.png" },
    { name: "Fire Axe",     img: "https://yeeplist.page.gd/images/Desert.png" },
    { name: "Scythe",       img: "https://yeeplist.page.gd/images/Horror.jpg" }
  ],

  ctaBand: {
    headline: "Join the community",
    body: "Keep up with rank updates, tier resets, and everything Yeeps PvP.",
    buttonLabel: "Join Our Discord"
  },

  footer: {
    left: "The Yeeps List — not affiliated with Trass Games",
    right: "V2.0 Pre-release 1"
  }
};
/* ===================== end of editable section ===================== */

function el(tag, attrs = {}, html) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (html !== undefined) node.innerHTML = html;
  return node;
}

document.getElementById("brandLogo").src = siteConfig.brand.logo;
document.getElementById("brandName").textContent = siteConfig.brand.name;
document.getElementById("brandSub").textContent = siteConfig.brand.sub;

const topLinks = document.getElementById("topLinks");
siteConfig.topLinks.forEach(link => topLinks.appendChild(el("a", { href: link.href }, link.label)));
topLinks.appendChild(el("a", {
  class: "discord-pill", href: siteConfig.discord.url, target: "_blank", rel: "noopener"
}, `<img src="${siteConfig.discord.icon}" alt="" /> ${siteConfig.discord.label}`));

document.getElementById("heroEyebrow").textContent = siteConfig.hero.eyebrow;
document.getElementById("heroHeadline").innerHTML = siteConfig.hero.headlineHtml;
document.getElementById("heroLede").textContent = siteConfig.hero.lede;
document.getElementById("ringCoreImg").src = siteConfig.hero.ringCenterImage;

const heroCtas = document.getElementById("heroCtas");
heroCtas.appendChild(el("a", { class: "btn-primary", href: siteConfig.hero.primaryCta.href }, siteConfig.hero.primaryCta.label));
heroCtas.appendChild(el("a", { class: "btn-ghost", href: siteConfig.hero.secondaryCta.href }, siteConfig.hero.secondaryCta.label));

const ring = document.getElementById("ring");
const n = siteConfig.ringWeapons.length;
siteConfig.ringWeapons.forEach((w, i) => {
  const angle = (360 / n) * i;
  const item = el("div", { class: "ring-item" });
  item.style.transform = `rotate(${angle}deg) translate(150px) rotate(-${angle}deg)`;
  item.appendChild(el("span", {}, `<img src="${w.img}" alt="${w.name}" title="${w.name}" />`));
  ring.appendChild(item);
});

const navGrid = document.getElementById("navGrid");
siteConfig.navCards.forEach(card => {
  navGrid.appendChild(el("a", { class: "nav-card", href: card.href }, `
    <div class="icon-badge">${card.icon}</div>
    <h3>${card.title}</h3>
    <p>${card.desc}</p>
    <div class="go">${card.cta}</div>
  `));
});

const weaponStrip = document.getElementById("weaponStrip");
siteConfig.weaponStrip.forEach(w => {
  weaponStrip.appendChild(el("div", { class: "weapon-chip" }, `<img src="${w.img}" alt="" />${w.name}`));
});

document.getElementById("ctaHeadline").textContent = siteConfig.ctaBand.headline;
document.getElementById("ctaBody").textContent = siteConfig.ctaBand.body;
document.getElementById("ctaDiscordBtn").href = siteConfig.discord.url;
document.getElementById("ctaDiscordBtn").innerHTML = `<img src="${siteConfig.discord.icon}" alt="" /> ${siteConfig.ctaBand.buttonLabel}`;

document.getElementById("footerLeft").textContent = siteConfig.footer.left;
document.getElementById("footerRight").textContent = siteConfig.footer.right;
</script>

</body>
</html>
