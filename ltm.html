<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTMs — Yeeps Tiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#0f1720;--slate:#36394c;--muted:#94a3b8;--blood:#960330;--bright:#c8083f;--max:1180px}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#e6eef6;font-family:Inter;background:radial-gradient(1000px 500px at 15% -10%,rgba(150,3,48,.18),transparent 60%),linear-gradient(165deg,var(--bg),var(--slate))}a{color:inherit;text-decoration:none}.top{max-width:var(--max);margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:10px}.brand b{font:700 21px Rajdhani}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:8px 11px;color:var(--muted);font-size:13px;border-radius:8px}.nav a:hover,.nav .active{background:rgba(255,255,255,.05);color:#fff}.wrap{max-width:var(--max);margin:auto;padding:45px 24px}.head{margin-bottom:24px}.head h1{font:700 48px Rajdhani;margin:0}.head p{color:var(--muted);margin:5px 0 0}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--muted);padding:9px 13px;border-radius:9px;cursor:pointer;font-size:12px}.tab.active{background:linear-gradient(160deg,var(--bright),var(--blood));color:#fff;border-color:transparent}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.ltm{background:linear-gradient(165deg,rgba(20,20,20,.75),rgba(0,0,0,.5));border:1px solid rgba(255,255,255,.06);border-radius:15px;padding:20px}.topline{display:flex;align-items:center;gap:10px}.status{margin-left:auto;padding:5px 9px;border-radius:999px;background:rgba(200,8,63,.16);color:#ff7da0;font-size:10px;font-weight:700}.name{font:700 25px Rajdhani}.desc{color:var(--muted);font-size:13px;line-height:1.55;margin:12px 0}.date{font-size:11px;color:var(--muted)}.board{margin-top:15px;display:flex;flex-direction:column;gap:6px}.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.035);padding:8px;border-radius:8px;font-size:12px}.num{width:22px;color:var(--muted);font-weight:700}.pts{margin-left:auto;font-weight:800}.empty{color:var(--muted);padding:50px;text-align:center;grid-column:1/-1}.note{color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.nav a:not(.active){display:none}}
</style></head><body>
<header class="top"><a class="brand" href="index.html"><img src="https://yeeplist.page.gd/images/PvP_Rank.jpeg"><div><b>Yeeps Tiers</b><small>The Yeeps List</small></div></a><nav class="nav"><a href="Ranks.html">Rankings</a><a href="Teams.html">Teams</a><a href="Card.html">Player Cards</a><a class="active" href="ltm.html">LTMs</a></nav></header>
<main class="wrap"><div class="head"><h1>Limited Time Modes</h1><p>Current and previous LTM leaderboards.</p></div><div class="tabs"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="current">Current</button><button class="tab" data-filter="ended">Ended</button></div><div class="grid" id="grid"></div><div class="note">Edit the <b>ltms</b> array near the bottom of this file to add real LTMs and leaderboard entries.</div></main>
<script type="module">
import {players} from "./Players.js";
/* ================= EDIT YOUR LTMs HERE ================= */
const ltms=[
 {name:"Example LTM",status:"current",start:"Add start date",end:"Add end date",description:"Replace this with the LTM description.",leaderboard:["Voffi","Kestrel","Marrow"]},
 {name:"Previous Example",status:"ended",start:"Add start date",end:"Add end date",description:"Replace this with the previous LTM description.",leaderboard:["Snapdragon","Hollowpoint"]}
];
/* ====================================================== */
const grid=document.querySelector("#grid");let filter="all";
function render(){grid.innerHTML="";const list=ltms.filter(x=>filter==="all"||x.status===filter);if(!list.length){grid.innerHTML='<div class="empty">No LTMs found.</div>';return}
list.forEach(x=>{const board=x.leaderboard.map((name,i)=>{const p=players.find(p=>p.name.toLowerCase()===name.toLowerCase());return `<div class="row"><span class="num">#${i+1}</span><span>${p?.name||name}</span><span class="pts">${p?.score??"—"}</span></div>`}).join("");const d=document.createElement("article");d.className="ltm";d.innerHTML=`<div class="topline"><div class="name">${x.name}</div><div class="status">${x.status==="current"?"CURRENT":"ENDED"}</div></div><div class="desc">${x.description}</div><div class="date">${x.start} → ${x.end}</div><div class="board">${board||'<div class="row">No leaderboard entries yet.</div>'}</div>`;grid.appendChild(d)})}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});render();
</script></body></html>
