<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teams — Yeeps Tiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#0f1720;--slate:#36394c;--muted:#94a3b8;--blood:#960330;--bright:#c8083f;--max:1180px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#e6eef6;font-family:Inter;background:radial-gradient(1000px 500px at 15% -10%,rgba(150,3,48,.18),transparent 60%),linear-gradient(165deg,var(--bg),var(--slate))}
a{color:inherit;text-decoration:none}.top{max-width:var(--max);margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:10px;object-fit:cover}.brand b{font-family:Rajdhani;font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:8px 11px;color:var(--muted);font-size:13px;border-radius:8px}.nav a:hover,.nav .active{background:rgba(255,255,255,.05);color:#fff}.wrap{max-width:var(--max);margin:auto;padding:45px 24px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.head h1{font:700 48px Rajdhani;margin:0}.head p{color:var(--muted);margin:5px 0 0}.search{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 13px;color:#fff;min-width:230px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.team{background:linear-gradient(165deg,rgba(20,20,20,.75),rgba(0,0,0,.5));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;transition:.18s}.team:hover{transform:translateY(-3px);border-color:rgba(200,8,63,.4)}.teamtop{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(160deg,var(--blood),#17171b);display:grid;place-items:center;font:700 22px Rajdhani}.name{font:700 21px Rajdhani}.meta{font-size:12px;color:var(--muted)}.score{margin-left:auto;font-weight:800}.members{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.member{background:rgba(255,255,255,.04);padding:7px 9px;border-radius:8px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:50px}.note{margin-top:18px;color:var(--muted);font-size:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:520px){.grid{grid-template-columns:1fr}.nav a:not(.active){display:none}}
</style></head><body>
<header class="top"><a class="brand" href="index.html"><img src="https://yeeplist.page.gd/images/PvP_Rank.jpeg"><div><b>Yeeps Tiers</b><small>The Yeeps List</small></div></a><nav class="nav"><a href="Ranks.html">Rankings</a><a class="active" href="Teams.html">Teams</a><a href="Card.html">Player Cards</a><a href="ltm.html">LTMs</a></nav></header>
<main class="wrap"><div class="head"><div><h1>Team Rankings</h1><p>Teams are scored from the players assigned to them.</p></div><input class="search" id="search" placeholder="Search teams or players..."></div><div class="grid" id="grid"></div><div class="note">Edit the <b>teams</b> array near the bottom of this file to add your real teams. Player names should match Players.js.</div></main>
<script type="module">
import {players} from "./Players.js";
/* ================= EDIT YOUR TEAMS HERE ================= */
const teams = [
  {name:"Example Team",tag:"EX",members:["Voffi","Kestrel"],score:0},
  {name:"Example Team 2",tag:"EX2",members:["Marrow","Snapdragon","Hollowpoint"],score:0}
];
/* ======================================================== */
const grid=document.querySelector("#grid"),search=document.querySelector("#search");
function render(){
 const q=search.value.toLowerCase().trim(); grid.innerHTML="";
 const list=teams.map(t=>({...t,calc:t.score||t.members.reduce((s,n)=>s+(players.find(p=>p.name.toLowerCase()===n.toLowerCase())?.score||0),0)}))
 .filter(t=>!q||t.name.toLowerCase().includes(q)||t.tag.toLowerCase().includes(q)||t.members.some(n=>n.toLowerCase().includes(q)))
 .sort((a,b)=>b.calc-a.calc);
 if(!list.length){grid.innerHTML='<div class="empty">No teams found.</div>';return}
 list.forEach((t,i)=>{const d=document.createElement("article");d.className="team";d.innerHTML=`<div class="teamtop"><div class="logo">${t.tag}</div><div><div class="name">#${i+1} ${t.name}</div><div class="meta">${t.members.length} member${t.members.length===1?"":"s"}</div></div><div class="score">${t.calc}</div></div><div class="members">${t.members.map(n=>`<span class="member">${n}</span>`).join("")}</div>`;grid.appendChild(d)})
}
search.oninput=render;render();
</script></body></html>
