<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Cards — Yeeps Tiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--panel:#0f1720;--slate:#36394c;--muted:#94a3b8;--blood:#960330;--bright:#c8083f;--max:1180px}*{box-sizing:border-box}body{margin:0;color:#e6eef6;font-family:Inter;background:radial-gradient(1000px 500px at 15% -10%,rgba(150,3,48,.18),transparent 60%),linear-gradient(165deg,var(--bg),var(--slate));min-height:100vh}a{color:inherit;text-decoration:none}.top{max-width:var(--max);margin:auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:10px}.brand b{font:700 21px Rajdhani}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{padding:8px 11px;color:var(--muted);font-size:13px;border-radius:8px}.nav a:hover,.nav .active{background:rgba(255,255,255,.05);color:#fff}.wrap{max-width:var(--max);margin:auto;padding:45px 24px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.head h1{font:700 48px Rajdhani;margin:0}.head p{color:var(--muted);margin:5px 0 0}.search{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 13px;color:#fff;min-width:250px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:linear-gradient(150deg,rgba(25,25,29,.95),rgba(5,7,10,.8));border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px;overflow:hidden}.hero{display:flex;align-items:center;gap:13px}.avatar{width:62px;height:62px;border-radius:13px;object-fit:cover;background:#111}.pname{font:700 24px Rajdhani}.title{font-size:12px;color:var(--muted)}.score{margin-left:auto;text-align:right}.score b{font-size:21px}.score small{display:block;color:var(--muted);font-size:10px}.team{margin:13px 0;padding:7px 9px;background:rgba(255,255,255,.04);border-radius:8px;font-size:11px;color:var(--muted)}.cats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.cat{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.035);padding:7px;border-radius:8px;min-width:0}.cat img{width:28px;height:28px;border-radius:6px;object-fit:cover}.cat span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cat b{display:block;color:#fff;font-size:11px}.empty{text-align:center;color:var(--muted);padding:50px;grid-column:1/-1}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid{grid-template-columns:1fr}.head{flex-direction:column;align-items:stretch}.search{min-width:0;width:100%}.nav a:not(.active){display:none}}
</style></head><body>
<header class="top"><a class="brand" href="index.html"><img src="https://yeeplist.page.gd/images/PvP_Rank.jpeg"><div><b>Yeeps Tiers</b><small>The Yeeps List</small></div></a><nav class="nav"><a href="Ranks.html">Rankings</a><a href="Teams.html">Teams</a><a class="active" href="Card.html">Player Cards</a><a href="ltm.html">LTMs</a></nav></header>
<main class="wrap"><div class="head"><div><h1>Player Cards</h1><p>Every player's overall score and category tiers.</p></div><input class="search" id="search" placeholder="Search player..."></div><div class="grid" id="grid"></div></main>
<script type="module">
import {players} from "./Players.js";
const grid=document.querySelector("#grid"),search=document.querySelector("#search");
function render(){const q=search.value.toLowerCase().trim();grid.innerHTML="";const list=players.filter(p=>!q||p.name.toLowerCase().includes(q)||p.title.toLowerCase().includes(q)).sort((a,b)=>b.score-a.score);
if(!list.length){grid.innerHTML='<div class="empty">No players found.</div>';return}
list.forEach(p=>{const d=document.createElement("article");d.className="card";d.innerHTML=`<div class="hero"><img class="avatar" src="${p.avatar}" alt=""><div><div class="pname">${p.name}</div><div class="title">${p.title}</div></div><div class="score"><b>${p.score}</b><small>SCORE</small></div></div><div class="team">Team: ${p.team||"Free Agent"}</div><div class="cats">${p.categories.map(c=>`<div class="cat"><img src="${c.img}" alt=""><span>${c.cat}<b>${c.pos||"Unranked"}</b></span></div>`).join("")}</div>`;grid.appendChild(d)})}
search.oninput=render;render();
</script></body></html>
